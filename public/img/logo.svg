<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Dar Al Rimal monogram">
  <defs>
    <linearGradient id="lgGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4b36e"/>
      <stop offset="1" stop-color="#a98a44"/>
    </linearGradient>
    <linearGradient id="lgNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112240"/>
      <stop offset="1" stop-color="#060f1f"/>
    </linearGradient>
  </defs>
  <!-- D letterform -->
  <path d="M38 28 h44 c34 0 56 24 56 60 0 36 -22 60 -56 60 h-14 v-18 h14 c24 0 38 -17 38 -42 0 -25 -14 -42 -38 -42 h-26 v102 h-18 Z" fill="url(#lgNavy)"/>
