  <!-- dune sweep -->
  <path d="M20 168 q45 -34 90 -18 q42 15 70 -6 q-20 34 -66 26 q-52 -9 -94 -2 Z" fill="url(#lgGold)"/>
  <path d="M30 170 q50 -22 96 -12 q34 7 54 -6 q-16 22 -58 18 q-48 -5 -92 0 Z" fill="url(#lgNavy)" opacity="0.9"/>
  <!-- globe -->
  <circle cx="162" cy="42" r="20" fill="none" stroke="url(#lgGold)" stroke-width="4"/>
  <ellipse cx="162" cy="42" rx="9" ry="20" fill="none" stroke="url(#lgGold)" stroke-width="3"/>
  <path d="M143 36 h38 M143 49 h38" stroke="url(#lgGold)" stroke-width="3" fill="none"/>
  <!-- orbit -->
  <path d="M128 66 q34 12 52 -12" fill="none" stroke="url(#lgGold)" stroke-width="4" stroke-linecap="round"/>
</svg>
